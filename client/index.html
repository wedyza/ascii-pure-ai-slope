<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PodSite - Video to ASCII Player</title>
  <link rel="stylesheet" href="/src/styles/dark.css">
  <link rel="stylesheet" href="/src/styles/light.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: monospace;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    header {
      padding: 1rem 2rem;
      background: var(--bg-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 2rem;
    }

    .upload-area {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 3rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .upload-area:hover, .upload-area.dragover {
      border-color: var(--accent);
      background: var(--bg-secondary);
    }

    .upload-area button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .upload-area button:hover {
      background: var(--accent-hover);
    }

    .upload-hint {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 0.5rem;
    }

    .progress-bar {
      width: 100%;
      height: 20px;
      background: var(--bg-secondary);
      border-radius: 10px;
      overflow: hidden;
      margin: 1rem 0;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.3s;
    }

    .upload-error {
      color: var(--error);
      padding: 1rem;
      background: rgba(231, 76, 60, 0.1);
      border-radius: 4px;
    }

    .hidden {
      display: none !important;
    }

    .player-container {
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 1rem;
      border: 1px solid var(--border);
    }

    .ascii-display {
      font-size: 8px;
      line-height: 8px;
      overflow: auto;
      background: #000;
      color: #fff;
      padding: 1rem;
      border-radius: 4px;
      max-height: 60vh;
    }

    .player-controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-top: 1rem;
    }

    .player-controls button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .player-controls input[type="range"] {
      flex: 1;
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .theme-toggle:hover {
      background: var(--accent);
      color: white;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
